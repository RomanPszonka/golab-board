# Minimal in-cluster Postgres for Board's persistence.
#
# This is a convenience for getting started. For production, prefer a managed
# database (Cloud SQL, RDS, Crunchy/Zalando operator, etc.) and just point
# db.path in the board-config Secret at it — you can then delete this file.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: board
type: Opaque
stringData:
  POSTGRES_USER: board
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: board
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: board
spec:
  clusterIP: None # headless; stable DNS: postgres.board.svc.cluster.local
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: board
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U board -d board"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
